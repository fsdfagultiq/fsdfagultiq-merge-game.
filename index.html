<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<title>Night Market Merge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one 9:16 stall (540x960 logical) centered on dark lacquer; HUD + thumb bar are DOM layered over the Phaser canvas. */
:root{
  --wood:#2C1A1D; --ink:#170D0F; --bamboo:#D9A05B; --bamboo-hi:#F0C27E; --bamboo-dk:#5A3420;
  --cream:#FFF8E7; --soy:#3B1F14; --chili:#E63946; --jade:#52B788; --gold:#FFD166; --gem:#5FD3E8;
  --display:'Fredoka',ui-rounded,'Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --u:1px; color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--ink)}
body{height:100%;margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;place-items:center}
#wrap{position:relative;overflow:hidden;background:var(--wood);touch-action:none}
#wrap canvas{display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--u)*16)}
#ui button{font:inherit;color:inherit;cursor:pointer;pointer-events:auto}
#ui button:focus-visible{outline:calc(var(--u)*3) solid var(--gold);outline-offset:calc(var(--u)*3)}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*104);padding:calc(var(--u)*12) calc(var(--u)*20);
  box-sizing:border-box;display:grid;grid-template-columns:1fr auto auto;gap:calc(var(--u)*14);align-items:start;
  background:linear-gradient(180deg,rgba(23,13,15,.85),rgba(23,13,15,0))}
.score-lbl{font-family:var(--display);font-weight:600;font-size:calc(var(--u)*13);letter-spacing:.14em;color:var(--bamboo-hi);opacity:.85}
#score{font-family:var(--display);font-weight:700;font-size:calc(var(--u)*44);line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 calc(var(--u)*3) 0 rgba(0,0,0,.45)}
#bestRow{font-family:var(--display);font-weight:600;font-size:calc(var(--u)*15);color:var(--bamboo-hi);margin-top:calc(var(--u)*4);font-variant-numeric:tabular-nums}
.wallet{display:flex;flex-direction:column;gap:calc(var(--u)*7);padding-top:calc(var(--u)*4)}
.pill{display:flex;align-items:center;gap:calc(var(--u)*7);min-width:calc(var(--u)*108);padding:calc(var(--u)*4) calc(var(--u)*12) calc(var(--u)*4) calc(var(--u)*5);
  border-radius:999px;background:rgba(0,0,0,.38);border:calc(var(--u)*2) solid rgba(217,160,91,.35);
  font-family:var(--display);font-weight:600;font-size:calc(var(--u)*18);font-variant-numeric:tabular-nums}
.coin{width:calc(var(--u)*22);height:calc(var(--u)*22);border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE8A3,#F4B63F 60%,#B9791B);
  box-shadow:inset 0 0 0 calc(var(--u)*2) #9A6416}
.gem{width:calc(var(--u)*17);height:calc(var(--u)*17);margin:0 calc(var(--u)*2.5);transform:rotate(45deg);border-radius:calc(var(--u)*4);
  background:linear-gradient(135deg,#C9F6FF,#5FD3E8 50%,#1E8AA8);box-shadow:inset 0 0 0 calc(var(--u)*2) #176F87}
.next{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*5)}
#nextBox{position:relative;width:calc(var(--u)*72);height:calc(var(--u)*72);border-radius:calc(var(--u)*18);background:rgba(0,0,0,.38);
  border:calc(var(--u)*2) solid rgba(217,160,91,.5);display:grid;place-items:center}
#nextBox::before{content:"NEXT";position:absolute;top:calc(var(--u)*-9);left:50%;transform:translateX(-50%);padding:0 calc(var(--u)*7);
  border-radius:999px;background:var(--bamboo);color:var(--soy);font-family:var(--display);font-weight:700;font-size:calc(var(--u)*11);letter-spacing:.12em}
#nextImg{max-width:82%;max-height:82%}
#nextIce{position:absolute;bottom:calc(var(--u)*-8);padding:0 calc(var(--u)*6);border-radius:999px;background:#BDE9FF;color:#16506A;
  font-family:var(--display);font-weight:700;font-size:calc(var(--u)*10);letter-spacing:.1em}
#spiceBtn{display:flex;align-items:center;gap:calc(var(--u)*4);padding:calc(var(--u)*2) calc(var(--u)*8) calc(var(--u)*2) calc(var(--u)*3);border-radius:999px;
  border:calc(var(--u)*2) solid #B9791B;background:linear-gradient(#FFE08A,#F4B63F);color:var(--soy);font-family:var(--display);font-weight:700;font-size:calc(var(--u)*13)}
#spiceBtn img{width:calc(var(--u)*20);height:calc(var(--u)*20)}
#spiceBtn:disabled{filter:grayscale(.8);opacity:.45;cursor:default}

#fever{position:absolute;left:50%;top:calc(var(--u)*108);transform:translateX(-50%);padding:calc(var(--u)*5) calc(var(--u)*16);border-radius:999px;
  background:linear-gradient(90deg,#E63946,#FF8A3D);color:var(--cream);font-family:var(--display);font-weight:700;font-size:calc(var(--u)*18);letter-spacing:.06em;
  box-shadow:0 0 calc(var(--u)*18) rgba(255,120,60,.6);white-space:nowrap}
#fever.go{animation:fev .35s ease-out}
@keyframes fev{0%{transform:translateX(-50%) scale(.6)}60%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1)}}

/* Thumb bar */
#bar{position:absolute;left:calc(var(--u)*16);right:calc(var(--u)*16);top:calc(var(--u)*846);height:calc(var(--u)*100);
  display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*10)}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);
  border-radius:calc(var(--u)*20);border:calc(var(--u)*3) solid var(--bamboo-dk);color:var(--soy)!important;
  background:linear-gradient(180deg,var(--bamboo-hi),var(--bamboo));box-shadow:inset 0 calc(var(--u)*-6) 0 #B07A3A,0 calc(var(--u)*4) 0 rgba(0,0,0,.4);
  transition:transform .08s}
.tb:active{transform:translateY(calc(var(--u)*3));box-shadow:inset 0 calc(var(--u)*-3) 0 #B07A3A,0 calc(var(--u)*1) 0 rgba(0,0,0,.4)}
.tb svg{width:calc(var(--u)*38);height:calc(var(--u)*38)}
.tb b{font-family:var(--display);font-weight:700;font-size:calc(var(--u)*16);letter-spacing:.06em;line-height:1}
.tag{position:absolute;top:calc(var(--u)*-11);right:calc(var(--u)*-4);padding:calc(var(--u)*2) calc(var(--u)*8);border-radius:999px;
  font-family:var(--display);font-weight:700;font-size:calc(var(--u)*11);letter-spacing:.06em;color:var(--cream);background:var(--chili);
  border:calc(var(--u)*2) solid var(--ink);white-space:nowrap}
.tag.free{background:var(--jade)} .tag.gemtag{background:#1E8AA8} .tag:empty{display:none}

/* Modals */
#sheet{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,9,11,.74);pointer-events:auto;z-index:5}
.card{width:calc(var(--u)*440);max-width:88%;box-sizing:border-box;padding:calc(var(--u)*26) calc(var(--u)*24) calc(var(--u)*22);border-radius:calc(var(--u)*26);
  background:var(--cream);color:var(--soy);border:calc(var(--u)*5) solid var(--bamboo);box-shadow:0 calc(var(--u)*12) 0 rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:calc(var(--u)*14);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0;font-family:var(--display);font-weight:700;font-size:calc(var(--u)*32);line-height:1.05;text-align:center;text-wrap:balance}
.card p{margin:0;font-size:calc(var(--u)*17);line-height:1.4;text-align:center}
.card .fine{font-size:calc(var(--u)*13);opacity:.65}
.acts{display:flex;flex-direction:column;gap:calc(var(--u)*10)}
.btn{height:calc(var(--u)*58);border-radius:calc(var(--u)*16);border:calc(var(--u)*3) solid var(--soy);font-family:var(--display)!important;
  font-weight:700;font-size:calc(var(--u)*20)!important;letter-spacing:.03em;box-shadow:inset 0 calc(var(--u)*-5) 0 rgba(0,0,0,.2)}
.btn.primary{background:var(--chili);color:var(--cream)!important}
.btn.jade{background:var(--jade);color:#0f2a1c!important}
.btn.ghost{background:transparent;color:var(--soy)!important;box-shadow:none;border-color:rgba(59,31,20,.35)}
.btn:disabled{opacity:.4;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*8);text-align:center}
.stats div{padding:calc(var(--u)*10) 0;border-radius:calc(var(--u)*14);background:rgba(217,160,91,.22)}
.stats small{display:block;font-family:var(--display);font-weight:600;font-size:calc(var(--u)*12);letter-spacing:.12em;opacity:.7}
.stats strong{font-family:var(--display);font-size:calc(var(--u)*26);font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:1fr auto;gap:calc(var(--u)*12);align-items:center;padding:calc(var(--u)*14);border-radius:calc(var(--u)*16);
  background:rgba(217,160,91,.2);border:calc(var(--u)*2) solid rgba(217,160,91,.6)}
.item h3{margin:0 0 calc(var(--u)*3);font-family:var(--display);font-weight:700;font-size:calc(var(--u)*19)}
.item span{font-size:calc(var(--u)*14);line-height:1.35;display:block}
.item .btn{height:calc(var(--u)*50);min-width:calc(var(--u)*92);font-size:calc(var(--u)*18)!important;padding:0 calc(var(--u)*10)}
.walletline{display:flex;justify-content:center;gap:calc(var(--u)*16);font-family:var(--display);font-weight:600;font-size:calc(var(--u)*17)}
.walletline span{display:flex;align-items:center;gap:calc(var(--u)*6)}
.adbox{height:calc(var(--u)*170);border-radius:calc(var(--u)*16);background:repeating-linear-gradient(45deg,#3B1F14 0 calc(var(--u)*14),#4a2a1c calc(var(--u)*14) calc(var(--u)*28));
  color:var(--cream);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:calc(var(--u)*20);text-align:center;padding:calc(var(--u)*10)}
.adbar{height:calc(var(--u)*8);border-radius:999px;background:rgba(59,31,20,.2);overflow:hidden}
.adbar i{display:block;height:100%;width:0;background:var(--chili);animation:fill 1s linear forwards}
@keyframes fill{to{width:100%}}

#toast{position:absolute;left:50%;top:calc(var(--u)*790);transform:translateX(-50%);max-width:86%;padding:calc(var(--u)*9) calc(var(--u)*18);border-radius:999px;
  background:var(--cream);color:var(--soy);font-family:var(--display);font-weight:600;font-size:calc(var(--u)*16);text-align:center;
  box-shadow:0 calc(var(--u)*6) 0 rgba(0,0,0,.35);z-index:6;transition:opacity .25s}
#tapHint{position:absolute;left:50%;top:calc(var(--u)*470);transform:translateX(-50%);padding:calc(var(--u)*10) calc(var(--u)*20);border-radius:999px;
  background:rgba(23,13,15,.7);font-family:var(--display);font-weight:600;font-size:calc(var(--u)*19);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(calc(var(--u)*-6))}}
@media (prefers-reduced-motion:reduce){#tapHint,#fever.go,.card{animation:none}}
</style>

<div id="app">
  <div id="wrap">
    <div id="ui">
      <div id="hud">
        <div>
          <div class="score-lbl">SCORE</div>
          <div id="score">0</div>
          <div id="bestRow">BEST <span id="best">0</span></div>
        </div>
        <div class="wallet">
          <div class="pill" title="Coins"><i class="coin"></i><span id="coins">0</span></div>
          <div class="pill" title="Gems"><i class="gem"></i><span id="gems">0</span></div>
        </div>
        <div class="next">
          <div id="nextBox"><img id="nextImg" alt="Next piece"><span id="nextIce" hidden>ICED</span></div>
          <button id="spiceBtn" type="button" aria-label="Load a Golden Spice wildcard"><img id="spiceImg" alt=""><span id="spiceCount">0</span></button>
        </div>
      </div>
      <div id="fever" hidden></div>
      <div id="tapHint">Tap or drag to drop</div>

      <div id="bar">
        <button class="tb" id="btnToss" type="button" aria-label="Toss the wok">
          <span class="tag" id="tagToss"></span>
          <svg viewBox="0 0 40 40" fill="none" stroke="#3B1F14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h24a10 10 0 0 1-24 0z" fill="#3B1F14" fill-opacity=".15"/><path d="M29 22l8-3"/><circle cx="13" cy="11" r="3"/><circle cx="21" cy="7" r="2.5"/><circle cx="24" cy="14" r="2"/></svg>
          <b>TOSS</b>
        </button>
        <button class="tb" id="btnSwap" type="button" aria-label="Swap the piece in your hand">
          <span class="tag gemtag" id="tagSwap"></span>
          <svg viewBox="0 0 40 40" fill="none" stroke="#3B1F14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 15a12 12 0 0 1 21-5l3 3"/><path d="M32 6v7h-7"/><path d="M32 25a12 12 0 0 1-21 5l-3-3"/><path d="M8 34v-7h7"/></svg>
          <b>SWAP</b>
        </button>
        <button class="tb" id="btnEat" type="button" aria-label="Eat all small pieces">
          <span class="tag gemtag" id="tagEat"></span>
          <svg viewBox="0 0 40 40" fill="none" stroke="#3B1F14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4l9 22M18 3l4 23"/><path d="M6 26h28a14 10 0 0 1-28 0z" fill="#3B1F14" fill-opacity=".15"/></svg>
          <b>EAT SMALL</b>
        </button>
        <button class="tb" id="btnShop" type="button" aria-label="Open the shop">
          <span class="tag free" id="tagShop"></span>
          <svg viewBox="0 0 40 40" fill="none" stroke="#3B1F14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h26l-2 20H9z" fill="#3B1F14" fill-opacity=".15"/><path d="M14 14v-3a6 6 0 0 1 12 0v3"/></svg>
          <b>SHOP</b>
        </button>
      </div>

      <div id="sheet" hidden></div>
      <div id="toast" hidden></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.87.0/phaser.min.js"></script>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ constants */
const W = 540, H = 960, S = 2;                       // S = texture supersampling (high-DPI art)
const BOX = { x: 40, y: 205, w: 460, h: 620 }; BOX.right = BOX.x + BOX.w; BOX.bottom = BOX.y + BOX.h;
const DANGER_Y = BOX.y + 40;
const HOLD_Y = 158;
const WILD_R = 26;
const DROP_COOLDOWN = 450, MIN_AGE = 1500, GRACE_MS = 3000, COMBO_WINDOW = 1500, COMBO_MAX = 5;
const PHYS = { restitution: 0.25, friction: 0.06, frictionAir: 0.005, density: 0.002 };
const TIERS = [null,
  { name: 'Boba Pearl',    r: 18,  hex: '#2B1B17', score: 2,    coins: 1,   spawn: 30 },
  { name: 'Edamame',       r: 24,  hex: '#76C893', score: 4,    coins: 1,   spawn: 28 },
  { name: 'Maki Roll',     r: 31,  hex: '#FF6B6B', score: 8,    coins: 2,   spawn: 22 },
  { name: 'Golden Gyoza',  r: 39,  hex: '#F4A261', score: 16,   coins: 3,   spawn: 12 },
  { name: 'Takoyaki',      r: 48,  hex: '#8D5524', score: 32,   coins: 5,   spawn: 8 },
  { name: 'Onigiri',       r: 58,  hex: '#F8F9FA', score: 64,   coins: 8,   spawn: 0 },
  { name: 'Steamed Baozi', r: 69,  hex: '#FFE5B4', score: 128,  coins: 12,  spawn: 0 },
  { name: 'Matcha Donut',  r: 81,  hex: '#52B788', score: 256,  coins: 20,  spawn: 0 },
  { name: 'Ramen Bowl',    r: 94,  hex: '#E63946', score: 512,  coins: 35,  spawn: 0 },
  { name: 'Curry Plate',   r: 108, hex: '#E9C46A', score: 1024, coins: 60,  spawn: 0 },
  { name: 'Giant Hotpot',  r: 124, hex: '#D00000', score: 2048, coins: 150, spawn: 0 },
];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ------------------------------------------------------------------ persistence (localStorage, guarded) */
const store = {
  get(k, d) { try { const v = localStorage.getItem('nmm_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nmm_' + k, JSON.stringify(v)); } catch (e) {} },
};
const profile = Object.assign({ best: 0, coins: 0, gems: 0, adsRemoved: false, wildBank: 0, runs: 0 }, store.get('profile', {}));
const saveProfile = () => store.set('profile', profile);
// Simulated store-side receipts (what the App Store / Play account "remembers"), kept apart from local entitlements.
const receipts = { list() { return store.get('mock_store_receipts', []); }, add(id) { const l = this.list(); if (!l.includes(id)) { l.push(id); store.set('mock_store_receipts', l); } } };

/* ------------------------------------------------------------------ procedural Web Audio */
const Sfx = {
  ctx: null, master: null, noiseBuf: null, lastTap: 0,
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
        const len = Math.floor(this.ctx.sampleRate * 0.6);
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  ok() { return this.ctx && this.ctx.state === 'running'; },
  tone(type, t0, pts, dur, vol) {           // pts: [[freq, atTimeOffset], ...]
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(pts[0][0], t0);
    for (let i = 1; i < pts.length; i++) o.frequency.exponentialRampToValueAtTime(pts[i][0], t0 + pts[i][1]);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.004, dur / 4));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(t0, dur, type, freq, vol, q = 1) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t0, Math.random() * 0.4); s.stop(t0 + dur + 0.02);
  },
  // (1) soft bamboo/squish tap — throttled 60ms
  tap(strength = 1) {
    if (!this.ok()) return; const now = performance.now(); if (now - this.lastTap < 60) return; this.lastTap = now;
    const t = this.ctx.currentTime, v = Math.min(1, 0.45 + strength * 0.12);
    this.tone('sine', t, [[320, 0], [140, 0.02]], 0.02, 0.32 * v);
    this.noise(t, 0.012, 'bandpass', 1200, 0.22 * v, 1.4);
  },
  // (2) bubbly pop + wok sizzle on Tier 5+/combos
  pop(tier, combo) {
    if (!this.ok()) return; const t = this.ctx.currentTime;
    const f = 350 * Math.pow(1.12246, tier + combo);
    this.tone('sine', t, [[f * 0.7, 0], [f * 1.25, 0.045], [f, 0.13]], 0.16, 0.38);
    this.tone('triangle', t + 0.01, [[f * 2, 0], [f * 2.4, 0.05]], 0.08, 0.07);
    if (tier >= 5 || combo > 0) this.noise(t, 0.06, 'highpass', 4500, 0.22);
  },
  // (3) kitchen timer double-beep
  beep() {
    if (!this.ok()) return; const t = this.ctx.currentTime;
    this.tone('sine', t, [[880, 0]], 0.07, 0.3); this.tone('sine', t + 0.13, [[880, 0]], 0.07, 0.3);
  },
  // (4) Eat Small pop-crunch
  eat() {
    if (!this.ok()) return; const t = this.ctx.currentTime;
    this.tone('sine', t, [[400, 0], [700, 0.06], [200, 0.18]], 0.2, 0.4);
    this.noise(t + 0.05, 0.05, 'bandpass', 2600, 0.25, 0.8); this.noise(t + 0.11, 0.04, 'bandpass', 1900, 0.18, 0.8);
  },
  sizzle() { if (!this.ok()) return; this.noise(this.ctx.currentTime, 0.35, 'highpass', 3200, 0.2); },
};
window.addEventListener('pointerdown', () => Sfx.unlock(), { once: true, capture: true });
window.addEventListener('keydown', () => Sfx.unlock(), { once: true, capture: true });

/* ------------------------------------------------------------------ procedural kawaii art */
if (!CanvasRenderingContext2D.prototype.roundRect) {        // Safari < 16, Firefox < 112
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {

      if (restored) this.toast('Restored: Remove Ads + 2x Coins.');

      text: canRevive ? 'Watch an ad to clear the top 30% of dishes and keep cooking. You can revive once per run.' : 'Your stall is closing for the night.',
      html: `<div class="stats"><div><small>SCORE</small><strong>${score.toLocaleString()}</strong></div><div><small>BEST</small><strong>${best.toLocaleString()}</strong></div><div><small>COINS</small><strong>+${coins.toLocaleString()}</strong></div></div>`,

/* ------------------------------------------------------------------ the scene */
const MBody = () => Phaser.Physics.Matter.Matter.Body;

class Kitchen extends Phaser.Scene {
  constructor() { super('kitchen'); }

  create() {
    const tex = this.textures;
    const add = (key, cv) => { tex.addCanvas(key, cv); UI.urls[key] = cv.toDataURL(); };
    for (let t = 1; t <= 11; t++) add('food' + t, foodCanvas(t));
    add('wild', wildCanvas());
    tex.addCanvas('bg', bgCanvas()); tex.addCanvas('steamBack', steamerBack()); tex.addCanvas('steamFront', steamerFront()); tex.addCanvas('dot', dotCanvas());

    this.add.image(0, 0, 'bg').setOrigin(0).setDepth(0);
    this.add.image(0, 0, 'steamBack').setOrigin(0).setDepth(1);
    this.add.image(0, 0, 'steamFront').setOrigin(0).setDepth(7);
    this.guideG = this.add.graphics().setDepth(2);
    this.dangerG = this.add.graphics().setDepth(8);
    this.timerText = this.add.text(W / 2, DANGER_Y + 74, '', { fontFamily: 'Fredoka, Nunito, sans-serif', fontSize: '64px', fontStyle: '700', color: '#FFF8E7', stroke: '#E63946', strokeThickness: 10 })
      .setOrigin(0.5).setDepth(12).setVisible(false);
    this.timerSub = this.add.text(W / 2, DANGER_Y + 124, 'KITCHEN TIMER!', { fontFamily: 'Fredoka, Nunito, sans-serif', fontSize: '22px', fontStyle: '700', color: '#FFD9DC', stroke: '#2C1A1D', strokeThickness: 6 })
      .setOrigin(0.5).setDepth(12).setVisible(false);

    // Steamer walls (side walls extend far up so TOSS can never fling food out)
    const wo = { isStatic: true, friction: 0.06, restitution: 0.1, label: 'wall' };
    this.matter.add.rectangle(BOX.x - 20, BOX.bottom - (BOX.h + 700) / 2, 40, BOX.h + 700, wo);
    this.matter.add.rectangle(BOX.right + 20, BOX.bottom - (BOX.h + 700) / 2, 40, BOX.h + 700, wo);
    this.matter.add.rectangle(W / 2, BOX.bottom + 20, BOX.w + 80, 40, wo);

    this.matter.world.on('collisionstart', e => this.onCollide(e, true));
    this.matter.world.on('collisionactive', e => this.onCollide(e, false));

    this.pieces = new Set(); this.mergeQueue = []; this.iceMade = {};
    this.hold = this.add.image(W / 2, HOLD_Y, 'food1').setScale(1 / S).setDepth(11);
    this.holdIce = this.add.image(W / 2, HOLD_Y, 'wild').setScale(1 / S).setDepth(11).setVisible(false);
    this.aimX = W / 2;

    this.input.on('pointermove', p => { this.aimX = p.x; });
    this.input.on('pointerdown', p => { this.aimX = p.x; this.armed = !UI.modalOpen && performance.now() - (UI.closedAt || 0) > 250; });
    this.input.on('pointerup', p => { if (this.armed) { this.armed = false; this.aimX = p.x; this.drop(); } });
    this.keys = this.input.keyboard.addKeys('LEFT,RIGHT,A,D');
    this.input.keyboard.addCapture('SPACE,DOWN');
    document.getElementById('ui').addEventListener('click', e => { const b = e.target.closest('.tb,#spiceBtn'); if (b) b.blur(); });
    this.input.keyboard.on('keydown-SPACE', () => this.drop());
    this.input.keyboard.on('keydown-DOWN', () => this.drop());

    UI.bind(this);
    this.newRun();
  }

  /* ---------- helpers */
  keyOf(spec) { return spec.wild ? 'wild' : 'food' + spec.tier; }
  radiusOf(spec) { return spec.wild ? WILD_R : TIERS[spec.tier].r; }
  iceKey(tier) { const k = 'ice' + tier; if (!this.iceMade[k]) { this.textures.addCanvas(k, iceCanvas(tier)); this.iceMade[k] = true; } return k; }
  clampX(x, r) { return Phaser.Math.Clamp(x, BOX.x + r + 2, BOX.right - r - 2); }
  rollTier() { let roll = Math.random() * 100; for (let t = 1; t <= 5; t++) { roll -= TIERS[t].spawn; if (roll < 0) return t; } return 1; }
  gen() {
    this.genIndex++;
    if (this.genIndex % 15 === 0) return { wild: true };                         // every 15th drop: Golden Spice Orb
    return { tier: this.rollTier(), frozen: this.score >= 1500 && Math.random() < 0.1 };
  }
  setPaused(b) {
    this.paused = b;
    if (b) this.matter.world.pause(); else if (this.state === 'play') this.matter.world.resume();
  }

  newRun() {
    for (const p of [...this.pieces]) this.removePiece(p);
    this.mergeQueue = [];
    Object.assign(this, { score: 0, runCoins: 0, combo: 0, lastMergeAt: -1e9, genIndex: 0, tossFree: 1, revived: false,
      countdown: null, playClock: 0, nextDropAt: 0, dangerSuspendUntil: 0, maxTier: 5, state: 'play' });
    this.current = this.gen(); this.next = this.gen();
    this.timerText.setVisible(false); this.timerSub.setVisible(false);
    this.setPaused(UI.modalOpen);
    UI.refresh();
  }

  spawn(spec, x, y) {
    const r = this.radiusOf(spec);
    const body = this.matter.add.circle(x, y, r, Object.assign({ label: 'piece' }, PHYS));
    body.isMerging = false;                                                          // merge debounce lock flag
    const sprite = this.add.image(x, y, this.keyOf(spec)).setScale(1 / S).setDepth(5);
    let ice = null;
    if (spec.frozen && !spec.wild) { ice = this.add.image(x, y, this.iceKey(spec.tier)).setScale(1 / S).setDepth(6); sprite.setTint(0xd2efff); }
    const p = { body, sprite, ice, tier: spec.wild ? 0 : spec.tier, wild: !!spec.wild, frozen: !!(spec.frozen && !spec.wild), r, born: this.playClock };
    body.piece = p; this.pieces.add(p); return p;
  }
  removePiece(p) { this.matter.world.remove(p.body); p.sprite.destroy(); if (p.ice) p.ice.destroy(); this.pieces.delete(p); }

  /* ---------- input actions */
  drop() {
    if (this.state !== 'play' || this.paused || UI.modalOpen) return;
    if (this.playClock < this.nextDropAt || !this.current) return;
    $('tapHint').hidden = true;
    const spec = this.current, r = this.radiusOf(spec);
    this.spawn(spec, this.clampX(this.aimX, r), HOLD_Y);
    this.nextDropAt = this.playClock + DROP_COOLDOWN;
    this.current = this.next; this.next = this.gen();
    UI.refresh();
  }
  useSpice() {
    if (this.state !== 'play' || UI.modalOpen || profile.wildBank <= 0 || this.current.wild) return false;
    profile.wildBank--; saveProfile(); this.current = { wild: true }; UI.refresh(); return true;
  }
  toss() {
    const B = MBody();
    for (const p of this.pieces) {
      B.setVelocity(p.body, { x: (Math.random() - 0.5) * 9, y: -(6 + Math.random() * 6) });
      B.setAngularVelocity(p.body, (Math.random() - 0.5) * 0.3);
    }
    this.dangerSuspendUntil = this.playClock + 2000; this.countdown = null; this.timerText.setVisible(false); this.timerSub.setVisible(false);
    Sfx.sizzle(); if (!REDUCED) this.cameras.main.shake(220, 0.006);
    this.floatText(W / 2, BOX.y + 120, 'WOK TOSS!', '#FFD166', 34);
  }
  swap() {
    if (this.current.wild) { UI.toast('You are holding a Golden Spice. Drop it first.'); return; }
    const old = this.current.wild ? 0 : this.current.tier; let t = this.rollTier(), n = 0;
    while (t === old && n++ < 20) t = this.rollTier();
    this.current = { tier: t }; Sfx.tap(3); UI.refresh();
  }
  eatSmall() {
    const small = [...this.pieces].filter(p => !p.wild && p.tier <= 2 && !p.body.isMerging);
    let pts = 0;
    for (const p of small) { this.burst(p.body.position.x, p.body.position.y, p.tier, 6); pts += TIERS[p.tier].score; this.removePiece(p); }
    this.score += pts; Sfx.eat();
    this.floatText(W / 2, BOX.y + 140, small.length ? `Itadakimasu! ${small.length} eaten` : 'Nothing small to eat', '#FFF8E7', 28);
    UI.refresh();
  }

  /* ---------- collisions & merging */
  onCollide(e, isStart) {
    if (this.state !== 'play') return;
    for (const pair of e.pairs) {
      const a = pair.bodyA.parent || pair.bodyA, b = pair.bodyB.parent || pair.bodyB;
      if (isStart) {
        const rv = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
        if (rv > 1.5) Sfx.tap(rv);
      }
      if (a.piece && b.piece) this.tryMerge(a, b);
    }
  }
  tryMerge(a, b) {
    if (a.isMerging || b.isMerging) return;                                          // DEBOUNCE LOCK
    const pa = a.piece, pb = b.piece;
    if (pa.frozen || pb.frozen) return;                                              // ice blocks merging
    let result, anchor = null;
    if (pa.wild && pb.wild) return;
    if (pa.wild || pb.wild) { const o = pa.wild ? pb : pa; if (o.tier < 1 || o.tier > 10) return; result = o.tier + 1; anchor = o; }
    else if (pa.tier === pb.tier) result = pa.tier + 1;
    else return;
    a.isMerging = true; b.isMerging = true;                                          // lock both immediately
    this.mergeQueue.push({ pa, pb, result, anchor });
  }
  processMerges() {
    if (!this.mergeQueue.length) return;
    const q = this.mergeQueue; this.mergeQueue = [];
    for (const m of q) {
      const { pa, pb } = m; if (!this.pieces.has(pa) || !this.pieces.has(pb)) continue;
      const A = pa.body.position, B = pb.body.position;
      const x = m.anchor ? m.anchor.body.position.x : (A.x + B.x) / 2, y = m.anchor ? m.anchor.body.position.y : (A.y + B.y) / 2;
      const vx = (pa.body.velocity.x + pb.body.velocity.x) / 2, vy = (pa.body.velocity.y + pb.body.velocity.y) / 2;
      this.removePiece(pa); this.removePiece(pb);
      this.merged(m.result, x, y, vx, vy, !!m.anchor);
    }
  }
  merged(result, x, y, vx, vy, viaWild) {
    const now = this.playClock;
    this.combo = (now - this.lastMergeAt <= COMBO_WINDOW) ? Math.min(COMBO_MAX, this.combo + 1) : 1;   // Wok Fever: comboCount 1..5
    this.lastMergeAt = now;
    const mult = this.combo, fever = this.combo > 1, fxTier = Math.min(result, 11);
    let pts, coins;
    if (result > 11) {                                                               // two Giant Hotpots: feast clears them
      pts = 4096 * mult; coins = 300 * mult;
      this.floatText(x, y - 60, 'NIGHT MARKET FEAST!', '#FFD166', 40);
      this.burst(x, y, 11, 30);
    } else {
      const np = this.spawn({ tier: result }, this.clampX(x, TIERS[result].r), y);
      MBody().setVelocity(np.body, { x: vx * 0.5, y: Math.min(vy, 0) * 0.5 });
      this.squashPop(np.sprite);
      pts = TIERS[result].score * mult; coins = TIERS[result].coins * mult;
      this.burst(x, y, fxTier);
    }
    if (profile.adsRemoved) coins *= 2;
    this.score += pts; this.runCoins += coins; profile.coins += coins; saveProfile();
    Sfx.pop(fxTier, this.combo - 1);
    this.floatText(x, y - 10, '+' + pts.toLocaleString(), '#FFF8E7', 26 + Math.min(fxTier, 8) * 2);
    if (fever) { this.floatText(x, y - 52, `x${mult} WOK FEVER!`, '#FF8A3D', 30); UI.fever(mult); }
    if (viaWild) this.floatText(x, y + 30, 'SPICED UP!', '#FFD166', 22);
    if ((fxTier >= 6 || fever) && !REDUCED) this.cameras.main.shake(160, fxTier >= 9 ? 0.009 : 0.004);
    this.thawNear(x, y, result <= 11 ? TIERS[result].r : 124);
    if (result <= 11 && result > this.maxTier) { this.maxTier = result; UI.toast(`New dish unlocked: ${TIERS[result].name}!`); }
    UI.refresh();
  }
  thawNear(x, y, mergedR) {
    for (const p of this.pieces) {
      if (!p.frozen) continue;
      if (Phaser.Math.Distance.Between(x, y, p.body.position.x, p.body.position.y) <= Math.max(p.r, mergedR) * 2.5) {   // adjacent merge within radius*2.5 thaws the ice
        p.frozen = false; p.sprite.clearTint();
        const ice = p.ice; p.ice = null;
        if (ice) this.tweens.add({ targets: ice, scale: ice.scale * 1.35, alpha: 0, duration: 260, onComplete: () => ice.destroy() });
        const em = this.add.particles(p.body.position.x, p.body.position.y, 'dot', { speed: { min: 60, max: 180 }, angle: { min: 0, max: 360 }, lifespan: 450,
          scale: { start: 0.45, end: 0 }, tint: [0xBDE9FF, 0xFFFFFF], emitting: false }).setDepth(9);
        em.explode(12); this.time.delayedCall(700, () => em.destroy());
        this.floatText(p.body.position.x, p.body.position.y, 'THAWED!', '#BDE9FF', 22);
        p.born = Math.min(p.born, this.playClock);
      }
    }
  }

  /* ---------- juice */
  squashPop(sprite) {
    const k = 1 / S; sprite.setScale(0.55 * k);
    this.tweens.chain({ targets: sprite, tweens: [
      { scaleX: 1.22 * k, scaleY: 1.12 * k, duration: 100, ease: 'Quad.easeOut' },
      { scaleX: 1.0 * k, scaleY: 1.0 * k, duration: 100, ease: 'Quad.easeIn' } ] });
  }
  burst(x, y, tier, count) {
    const hex = parseInt(TIERS[tier].hex.slice(1), 16);
    const em = this.add.particles(x, y, 'dot', {
      speed: { min: 70, max: 200 + tier * 14 }, angle: { min: 0, max: 360 }, lifespan: { min: 350, max: 750 },
      scale: { start: 0.5 + tier * 0.05, end: 0 }, alpha: { start: 1, end: 0 }, gravityY: -70, tint: [hex, 0xFFF8E7], emitting: false,
    }).setDepth(9);
    em.explode(count ?? (8 + tier * 2));
    this.time.delayedCall(900, () => em.destroy());
  }
  floatText(x, y, str, color, size) {
    const t = this.add.text(Phaser.Math.Clamp(x, 90, W - 90), y, str, { fontFamily: 'Fredoka, Nunito, sans-serif', fontSize: size + 'px', fontStyle: '700',
      color, stroke: '#2C1A1D', strokeThickness: 7, align: 'center' }).setOrigin(0.5).setDepth(10);
    this.tweens.add({ targets: t, y: y - 70, alpha: { from: 1, to: 0 }, scale: { from: 0.7, to: 1.05 }, duration: 950, ease: 'Cubic.easeOut', onComplete: () => t.destroy() });
  }

  /* ---------- game over / revive */
  gameOver() {
    this.state = 'over'; this.countdown = null; this.timerText.setVisible(false); this.timerSub.setVisible(false);
    this.matter.world.pause();
    const isBest = this.score > profile.best; if (isBest) profile.best = this.score; saveProfile();
    UI.gameOver({ score: this.score, best: profile.best, coins: this.runCoins, canRevive: !this.revived, isBest });
  }
  revive() {
    this.revived = true;
    const sorted = [...this.pieces].sort((a, b) => a.body.position.y - b.body.position.y);
    const n = Math.ceil(sorted.length * 0.3);
    for (const p of sorted.slice(0, n)) { this.burst(p.body.position.x, p.body.position.y, p.wild ? 1 : p.tier, 10); this.removePiece(p); }
    this.countdown = null; this.dangerSuspendUntil = this.playClock + 1500; this.timerText.setVisible(false); this.timerSub.setVisible(false);
    this.state = 'play'; this.setPaused(UI.modalOpen);
    Sfx.eat(); this.floatText(W / 2, BOX.y + 160, 'REVIVED!', '#52B788', 40);
    UI.refresh();
  }

  /* ---------- frame loop */
  update(time, delta) {
    for (const p of this.pieces) {
      const pos = p.body.position; p.sprite.setPosition(pos.x, pos.y).setRotation(p.body.angle);
      if (p.ice) p.ice.setPosition(pos.x, pos.y);
    }
    const playing = this.state === 'play' && !this.paused;

    // held piece + aim guide
    const cur = this.current;
    this.guideG.clear();
    if (cur && this.state === 'play') {
      if (playing) {
        if (this.keys.LEFT.isDown || this.keys.A.isDown) this.aimX -= 0.5 * delta;
        if (this.keys.RIGHT.isDown || this.keys.D.isDown) this.aimX += 0.5 * delta;
      }
      const r = this.radiusOf(cur), x = this.clampX(this.aimX, r); this.aimX = Phaser.Math.Clamp(this.aimX, BOX.x, BOX.right);
      const ready = this.playClock >= this.nextDropAt;
      this.hold.setVisible(true).setTexture(this.keyOf(cur)).setPosition(x, HOLD_Y).setAlpha(ready ? 1 : 0.35);
      if (cur.frozen) this.holdIce.setVisible(true).setTexture(this.iceKey(cur.tier)).setPosition(x, HOLD_Y).setAlpha(ready ? 1 : 0.35); else this.holdIce.setVisible(false);
      this.guideG.lineStyle(3, 0xFFF8E7, ready ? 0.22 : 0.08);
      for (let y = HOLD_Y + r + 8; y < BOX.bottom - 6; y += 22) this.guideG.lineBetween(x, y, x, Math.min(y + 11, BOX.bottom - 6));
    } else { this.hold.setVisible(false); this.holdIce.setVisible(false); }

    if (playing) {
      this.playClock += delta;
      this.processMerges();

      // 3-second red-line grace timer (never instant game over on drop)
      let danger = false;
      if (this.playClock >= this.dangerSuspendUntil) {
        for (const p of this.pieces) {
          if (p.body.isMerging) continue;
          if (this.playClock - p.born > MIN_AGE && p.body.position.y - p.r < DANGER_Y) { danger = true; break; }
        }
      }
      if (danger) {
        if (this.countdown === null) { this.countdown = GRACE_MS; this.lastBeep = 4; }
        this.countdown -= delta;
        const sec = Math.max(1, Math.ceil(this.countdown / 1000));
        if (sec < this.lastBeep) { this.lastBeep = sec; Sfx.beep(); }
        this.timerText.setText(String(sec)).setVisible(true); this.timerSub.setVisible(true);
        if (this.countdown <= 0) { this.gameOver(); }
      } else if (this.countdown !== null) {
        this.countdown = null; this.timerText.setVisible(false); this.timerSub.setVisible(false);
      }
    }

    // danger line: idle 0.3, pulses 0.3 → 1.0 during countdown
    const g = this.dangerG; g.clear();
    const counting = this.countdown !== null && this.state === 'play';
    g.setAlpha(counting ? 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * 0.014)) : 0.3);
    if (counting) { g.fillStyle(0xE63946, 0.18); g.fillRect(BOX.x, BOX.y, BOX.w, DANGER_Y - BOX.y); }
    g.lineStyle(4, 0xE63946, 1);
    for (let x = BOX.x + 4; x < BOX.right - 4; x += 22) g.lineBetween(x, DANGER_Y, Math.min(x + 12, BOX.right - 4), DANGER_Y);
  }
}

/* ------------------------------------------------------------------ boot */
const wrap = $('wrap'), app = $('app');
function fit() {
  const vw = app.clientWidth, vh = app.clientHeight; let h = vh, w = h * 9 / 16; if (w > vw) { w = vw; h = w * 16 / 9; }
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px'; document.documentElement.style.setProperty('--u', (w / W) + 'px');
}
fit(); window.addEventListener('resize', fit);

function start() {
  new Phaser.Game({
    type: Phaser.AUTO, parent: 'wrap', width: W, height: H, backgroundColor: '#2C1A1D',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'matter', matter: { gravity: { x: 0, y: 1.4 }, debug: false, positionIterations: 8, velocityIterations: 6 } },
    input: { activePointers: 2 },
    scene: Kitchen,
  });
}
const fontsReady = document.fonts ? Promise.race([Promise.all([document.fonts.load('700 24px Fredoka'), document.fonts.load('600 24px Fredoka')]), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(start, start);
})();
</script>
